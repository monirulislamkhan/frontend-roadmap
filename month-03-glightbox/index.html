<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLightbox test</title>
    <link href="css/glightbox.min.css" rel="stylesheet" />
    <style>
      body {
        font-family: system-ui;
        padding: 2rem;
        background: #f6f6f6;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        max-width: 900px;
      }
      .grid img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 0.4rem;
        display: block;
      }
      h2 {
        margin-top: 2rem;
      }
      .gcounter {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 999999;
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 0.3rem 0.7rem;
        border-radius: 0.3rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h2>Gallery</h2>
    <div class="grid">
      <a href="images/master-bedroom.webp" class="glightbox" data-gallery="gallery" data-title="Master Bedroom">
        <img src="images/master-bedroom.webp" alt="Master Bedroom" />
      </a>
      <a href="images/living-room.webp" class="glightbox" data-gallery="gallery" data-title="Living Room">
        <img src="images/living-room.webp" alt="Living Room" />
      </a>
      <a href="images/pool-deck.webp" class="glightbox" data-gallery="gallery" data-title="Pool Deck">
        <img src="images/pool-deck.webp" alt="Pool Deck" />
      </a>
    </div>

    <h2>Floor plans</h2>
    <div class="grid">
      <a href="images/fp-3bhk.webp" class="glightbox" data-gallery="floorPlan" data-title="3 BHK | 2150 sq ft">
        <img src="images/fp-3bhk.webp" alt="3 BHK floor plan" />
      </a>
      <a href="images/fp-4bhk-utility.webp" class="glightbox" data-gallery="floorPlan" data-title="4 BHK | 2800 sq ft">
        <img src="images/fp-4bhk-utility.webp" alt="4 BHK floor plan" />
      </a>
    </div>

    <script src="js/glightbox.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
