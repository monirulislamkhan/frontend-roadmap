<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enquiry Form</title>
    <style>
      /* Bare minimum. Only what the JS needs to show state. */
      body {
        background: #1f1f1f;
        color: #4b4b4b;
      }

      /* Sab text-type inputs + select + textarea */
      input,
      select,
      textarea {
        background: #2b2b2b;
        /* color: #e6e6e6; */
        border: 1px solid #444;
        padding: 4px 6px;
      }

      /* Radio, checkbox aur range ka apna native look hota hai —
         background wahan kaam nahi karta, accent-color karta hai. */
      input[type='radio'],
      input[type='checkbox'],
      input[type='range'] {
        background: none;
        border: none;
        padding: 0;
        /* accent-color: #1f1f1f; */
      }

      input::placeholder,
      textarea::placeholder {
        color: #888;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 1px solid #2d7a4f;
      }

      .error {
        color: #c0392b;
        font-size: 13px;
      }
      .invalid {
        outline: 1px solid #c0392b;
      }

      #result {
        color: #2d7a4f;
      }
      #result.error {
        color: #c0392b;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- <h3>Property Enquiry</h3> -->
    <form id="enquiry" novalidate>
      <div>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Name" />
        <p class="error" hidden id="name-error"></p>
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" />
        <p class="error" hidden id="email-error"></p>
      </div>

      <div>
        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">Select a country</option>
          <option value="India">India</option>
          <option value="UAE">UAE</option>
          <option value="Qatar">Qatar</option>
        </select>
        <p class="error" hidden id="country-error"></p>
      </div>

      <div>
        <label for="city">City</label>
        <select id="city" name="city">
          <option value="">Select a country first</option>
        </select>
        <p class="error" hidden id="city-error"></p>
      </div>

      <div>
        <label for="phone">Phone</label>
        <div>
          <select id="code" name="code">
            <option value="+91">+91</option>
            <option value="+971">+971</option>
            <option value="+974">+974</option>
          </select>
          <input type="tel" id="phone" name="phone" placeholder="9810011111" />
        </div>
        <p class="error" hidden id="phone-error"></p>
      </div>

      <div>
        <label>Configuration</label>
        <div>
          <label>
            <input type="radio" name="bhk" value="1" />
            1 BHK
          </label>
          <label>
            <input type="radio" name="bhk" value="2" />
            2 BHK
          </label>
          <label>
            <input type="radio" name="bhk" value="3" />
            3 BHK
          </label>
          <label>
            <input type="radio" name="bhk" value="4" />
            4+ BHK
          </label>
        </div>
        <p class="error" hidden id="bhk-error"></p>
      </div>

      <div>
        <label for="area">Minimum area (sq ft)</label>
        <input type="number" id="area" name="area" min="200" max="10000" step="50" placeholder="1000" />
        <p class="error" hidden id="area-error"></p>
      </div>

      <div>
        <label for="budget">
          Budget:
          <output id="budget-value">₹ 50 L</output>
        </label>
        <input type="range" id="budget" name="budget" min="1000000" max="100000000" step="500000" value="5000000" />
        <p class="error" hidden id="budget-error"></p>
      </div>

      <div>
        <label for="visit">Preferred site visit</label>
        <input type="date" id="visit" name="visit" />
        <p class="error" hidden id="visit-error"></p>
      </div>

      <div>
        <label for="status">Looking to</label>
        <div>
          <label>
            <input type="radio" name="status" value="sale" />
            Buy
          </label>
          <label>
            <input type="radio" name="status" value="rent" />
            Rent
          </label>
        </div>
        <p class="error" hidden id="status-error"></p>
      </div>

      <div>
        <label for="locality">Locality</label>
        <input
          type="text"
          id="locality"
          name="locality"
          list="localities"
          placeholder="Start typing…"
          autocomplete="off"
        />
        <datalist id="localities">
          <option value="Sector 62"></option>
          <option value="Sector 137"></option>
          <option value="DLF Phase 2"></option>
          <option value="Golf Course Road"></option>
          <option value="Indirapuram"></option>
        </datalist>
        <p class="error" hidden id="locality-error"></p>
      </div>

      <div>
        <label for="types">Property types (hold Ctrl / Cmd for more than one)</label>
        <select id="types" name="types" size="6" multiple>
          <optgroup label="Residential">
            <option value="apartment">Apartment</option>
            <option value="villa">Villa</option>
            <option value="builder floor">Builder floor</option>
          </optgroup>
          <optgroup label="Commercial">
            <option value="shop">Shop</option>
            <option value="office">Office</option>
            <option value="warehouse">Warehouse</option>
          </optgroup>
        </select>
        <p class="error" hidden id="types-error"></p>
      </div>

      <div>
        <label for="visit-time">Preferred time</label>
        <input type="time" id="visit-time" name="visit-time" min="09:00" max="19:00" />
        <p class="error" hidden id="visit-time-error"></p>
      </div>

      <div>
        <label for="docs">Attach documents (images or PDF)</label>
        <input type="file" id="docs" name="docs" accept="image/*,.pdf" multiple />
        <p id="docs-list"></p>
        <p class="error" hidden id="docs-error"></p>
      </div>

      <div>
        <label for="agent">Assigned agent</label>
        <input type="text" id="agent" name="agent" value="Rahul Verma" readonly />
      </div>

      <div>
        <label>Must-have amenities</label>
        <div>
          <label>
            <input type="checkbox" name="amenity" value="Parking" />
            Parking
          </label>
          <label>
            <input type="checkbox" name="amenity" value="Lift" />
            Lift
          </label>
          <label>
            <input type="checkbox" name="amenity" value="Power backup" />
            Power backup
          </label>
          <label>
            <input type="checkbox" name="amenity" value="Gym" />
            Gym
          </label>
        </div>
        <p class="error" hidden id="amenity-error"></p>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Anything else we should know?"></textarea>
        <p class="error" hidden id="message-error"></p>
      </div>

      <div>
        <div>
          <label>
            <input type="checkbox" id="terms" name="terms" />
            I agree to be contacted
          </label>
        </div>
        <p class="error" hidden id="terms-error"></p>
      </div>

      <input type="hidden" id="source" name="source" value="website-form" />

      <div>
        <button type="submit">Send enquiry</button>
        <button type="button" id="clear">Clear form</button>
      </div>
    </form>

    <div id="result" hidden></div>
    <script src="form.js"></script>
  </body>
</html>
